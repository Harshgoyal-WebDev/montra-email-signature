<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light only" />
  <title>Email Signature</title>
  <style>
    :root {
      color-scheme: light only;
      supported-color-schemes: light only;
    }

    body,
    table,
    td,
    p,
    a {
      color-scheme: light only;
    }

    [data-ogsc] .signature-wrapper,
    [data-ogsb] .signature-wrapper {
      background-color: #0b3fd6 !important;
    }

    [data-ogsc] .signature-name,
    [data-ogsb] .signature-name,
    [data-ogsc] .signature-title,
    [data-ogsb] .signature-title,
    [data-ogsc] .signature-contact,
    [data-ogsb] .signature-contact {
      color: #ffffff !important;
      -webkit-text-fill-color: #ffffff !important;
    }
  </style>
</head>

<body style="margin:0; padding:0;  color:#ffffff !important; color-scheme:light only;">
  <table
    class="signature-wrapper"
    cellpadding="0"
    cellspacing="0"
    width="600"
    height="200"
    style="
      width:600px !important;
      height:200px !important;
      background-image:url('https://montra-email-signature.vercel.app/img/montra-email-signature-bg.png');
      background-repeat:no-repeat;
      background-size:600px 200px;
      background-position:center;
      background-color:#0b3fd6 !important;
      color:#ffffff !important;
      color-scheme:light only;
      font-family:system-ui, Arial, sans-serif;
    "
    bgcolor="#0b3fd6"
  >
    <tr>
      <!-- LEFT CONTENT -->
      <td
        valign="top"
        width="360"
        style="padding-left:35px; padding-top:20px;"
      >
        <!-- Name + Designation -->
        <table cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td>
              <p
                class="signature-name"
                style="
                  margin:0;
                  font-size:22px;
                  line-height:28px;
                  font-weight:400;
                  color:#ffffff !important;
                  -webkit-text-fill-color:#ffffff !important;
                  letter-spacing:0px;
                "
              >
                Nirdesh Malik
              </p>

              <p
                class="signature-title"
                style="
                  margin:4px 0 0 0;
                  font-size:12px;
                  line-height:16px;
                  font-weight:400;
                  color:#ffffff !important;
                  -webkit-text-fill-color:#ffffff !important;
                "
              >
                Founder &amp; CEO
              </p>
            </td>
          </tr>
        </table>

        <!-- Divider -->
        <table cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td style="padding-top:10px; padding-bottom:12px;">
              <table cellpadding="0" cellspacing="0" width="160" height="1" style="border-collapse:collapse;">
                <tr>
                  <td width="160" height="1" style="font-size:0; line-height:1px; background-color:rgba(255,255,255,0.4);">&nbsp;</td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <!-- Contact Details -->
        <table cellpadding="0" cellspacing="0" width="320">
          <tr>
            <td width="24" height="26" valign="middle">
              <img src="https://montra-email-signature.vercel.app/img/contact-img-new.png" alt="Phone" width="16" height="16" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
            </td>
            <td height="26" valign="middle">
              <a
                class="signature-contact"
                href="tel:+2348023970955"
                style="
                  font-size:12px;
                  line-height:17px;
                  color:#ffffff !important;
                  -webkit-text-fill-color:#ffffff !important;
                  text-decoration:none;
                  font-weight:400;
                "
              >
                +234 802 397 0955
              </a>
            </td>
          </tr>

          <tr>
            <td width="24" height="26" valign="middle" style="padding-top:2px;">
              <img src="https://montra-email-signature.vercel.app/img/web-img-new.png" alt="Website" width="15" height="15" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
            </td>
            <td height="26" valign="middle">
              <a
                class="signature-contact"
                href="https://www.montra.app/"
                target="_blank"
                style="
                  font-size:12px;
                  line-height:17px;
                  color:#ffffff !important;
                  -webkit-text-fill-color:#ffffff !important;
                  text-decoration:none;
                  font-weight:300;
                "
              >
                www.montra.app
              </a>
            </td>
          </tr>

          <tr>
            <td width="24" height="36" valign="top" style="padding-top:10px;">
              <img src="https://montra-email-signature.vercel.app/img/location-img-new.png" alt="Location" width="14" height="15" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
            </td>
            <td height="36" valign="top" style="padding-top:4px;">
              <p
                class="signature-contact"
                style="
                  margin:0;
                  width:230px;
                  font-size:12px;
                  line-height:17px;
                  color:#ffffff !important;
                  -webkit-text-fill-color:#ffffff !important;
                  font-weight:300;
                "
              >
              20, Layi Yusuf Crescent, Off Admiralty,<br /> Lekki Phase 1, Lagos, Nigeria
                <!-- 312, Grandslam I-Thum, A-40,<br />
                Sector-62, Noida, Uttar Pradesh -->
              </p>
            </td>
          </tr>
        </table>
      </td>

      <!-- RIGHT SIDE -->
      <td valign="top" width="240">
        <table cellpadding="0" cellspacing="0" width="100%">
          <!-- Social Icons -->
          <tr>
            <td align="right" style="padding-top:22px; padding-right:30px;">
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td>
                    <a href="https://www.facebook.com/people/Montra-Nigeria/61553206088663/" target="_blank">
                      <img src="https://montra-email-signature.vercel.app/img/fb-img-new.png" alt="Facebook" width="20" height="20" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
                    </a>
                  </td>
                  <td style="padding-left:7px;">
                    <a href="https://x.com/MontraNige96058" target="_blank">
                      <img src="https://montra-email-signature.vercel.app/img/x-img-new.png" alt="X" width="20" height="20" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
                    </a>
                  </td>
                  <td style="padding-left:7px;">
                    <a href="https://www.instagram.com/accounts/login/?next=%2Fmontra.ng%2F&source=omni_redirect" target="_blank">
                      <img src="https://montra-email-signature.vercel.app/img/insta-img-new.png" alt="Instagram" width="20" height="20" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
                    </a>
                  </td>
                  <td style="padding-left:7px;">
                    <a href="https://www.linkedin.com/company/montra-inc/?_l=en_US" target="_blank">
                      <img src="https://montra-email-signature.vercel.app/img/linkedin-img-new.png" alt="LinkedIn" width="20" height="20" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

          <!-- Spacer -->
          <tr>
            <td height="100"></td>
          </tr>

          <!-- Logo -->
          <tr>
            <td align="right" style="padding-right:30px; padding-bottom:18px;">
              <a href="https://www.montra.app/" target="_blank">
                <img src="https://montra-email-signature.vercel.app/img/logo.png" alt="Montra" width="115" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
