<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Email Signature</title>
</head>

<body style="margin:0; padding:0;">
  <table
    cellpadding="0"
    cellspacing="0"
    width="600"
    height="250"
    style="
      width:600px !important;
      height:250px !important;
      background-image:url('./img/bg-img.png');
      background-repeat:no-repeat;
      background-size:600px 250px;
      background-position:center;
      background-color:#ffffff;
      font-family:Arial, Helvetica, sans-serif;
    "
  >
    <tr>
      <!-- LEFT CONTENT -->
      <td
        valign="top"
        width="330"
        style="padding-left:38px; padding-top:22px;"
      >
        <!-- Name + Designation -->
        <table cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td>
              <p
                style="
                  margin:0;
                  font-size:36px;
                  line-height:42px;
                  font-weight:500;
                  color:#000000;
                  letter-spacing:-1px;
                "
              >
                Bhaskar Varshney
              </p>

              <p
                style="
                  margin:4px 0 0 0;
                  font-size:15px;
                  line-height:19px;
                  font-weight:400;
                  color:#005DE9;
                "
              >
                Founder
              </p>
            </td>
          </tr>
        </table>

        <!-- Spacer -->
        <table cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td height="40"></td>
          </tr>
        </table>

        <!-- Contact Details -->
        <table cellpadding="0" cellspacing="0" width="310">
          <tr>
            <td width="38" height="34" valign="middle">
              <img src="./img/contact.png" alt="Phone" width="19" style="display:block;" />
            </td>
            <td height="34" valign="middle">
              <a
                href="tel:+91986543210"
                style="
                  font-size:15px;
                  line-height:20px;
                  color:#005DE9;
                  text-decoration:none;
                  font-weight:400;
                "
              >
                +91 986543210
              </a>
            </td>
          </tr>

          <tr>
            <td width="38" height="34" valign="middle">
              <img src="./img/web.png" alt="Website" width="19" style="display:block;" />
            </td>
            <td height="34" valign="middle">
              <a
                href="https://www.montra.app/"
                target="_blank"
                style="
                  font-size:15px;
                  line-height:20px;
                  color:#005DE9;
                  text-decoration:none;
                  font-weight:400;
                "
              >
                www.Montra.app
              </a>
            </td>
          </tr>

          <tr>
            <td width="38" height="34" valign="middle">
              <img src="./img/location.png" alt="Location" width="19" style="display:block;" />
            </td>
            <td height="34" valign="middle">
              <p
                style="
                  margin:0;
                  font-size:15px;
                  line-height:20px;
                  color:#005DE9;
                  font-weight:400;
                "
              >
                Brooklyn 435 street Ny USA
              </p>
            </td>
          </tr>
        </table>
      </td>

      <!-- RIGHT SIDE -->
      <td
        valign="top"
        width="270"
        style="padding-top:28px; padding-right:35px;"
      >
        <!-- Logo -->
        <table cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td align="right">
              <img
                src="./img/logo.png"
                alt="Montra"
                width="135"
                style="display:block;"
              />
            </td>
          </tr>
        </table>

        <!-- Social Icons -->
        <table cellpadding="0" cellspacing="0" width="100%">
          <tr>
            <td height="145"></td>
          </tr>

          <tr>
            <td align="right">
              <table cellpadding="0" cellspacing="0">
                <tr>
                  <td style="padding-left:20px;">
                    <a href="https://www.facebook.com/people/Montra-Nigeria/61553206088663/" target="_blank">
                      <img src="./img/fb.png" alt="Facebook" width="10" style="display:block;" />
                    </a>
                  </td>

                  <td style="padding-left:20px;">
                    <a href="https://www.linkedin.com/company/montra-inc/?_l=en_US" target="_blank">
                      <img src="./img/linkedin.png" alt="LinkedIn" width="18" style="display:block;" />
                    </a>
                  </td>

                  <td style="padding-left:20px;">
                    <a href="https://x.com/MontraNige96058" target="_blank">
                      <img src="./img/twitter.png" alt="X" width="18" style="display:block;" />
                    </a>
                  </td>

                  <td style="padding-left:20px;">
                    <a href="https://www.instagram.com/accounts/login/?next=%2Fmontra.ng%2F&source=omni_redirect" target="_blank">
                      <img src="./img/insta.png" alt="Instagram" width="18" style="display:block;" />
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
