<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light only" />
  <meta name="supported-color-schemes" content="light only" />
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no, url=no" />
  <title>Email Signature</title>
  <style>
    :root {
      color-scheme: light only;
      supported-color-schemes: light only;
    }

    body,
    table,
    td,
    p,
    a {
      color-scheme: light only;
    }

    [data-ogsc] .signature-wrapper,
    [data-ogsb] .signature-wrapper {
      background-color: #ffffff !important;
    }

    [data-ogsc] .signature-name,
    [data-ogsb] .signature-name {
      color: #141414 !important;
      -webkit-text-fill-color: #141414 !important;
    }

    [data-ogsc] .signature-title,
    [data-ogsb] .signature-title,
    [data-ogsc] .signature-contact,
    [data-ogsb] .signature-contact {
      color: #3a3a3a !important;
      -webkit-text-fill-color: #3a3a3a !important;
    }

    /* Neutralize Apple Mail's auto data-detector styling (phone/address links) */
    .x-apple-data-detectors,
    .x-apple-data-detectors *,
    a[x-apple-data-detectors] {
      color: inherit !important;
      text-decoration: none !important;
      font-size: inherit !important;
      font-family: inherit !important;
      font-weight: inherit !important;
      line-height: inherit !important;
    }
  </style>
</head>

<body style="margin:0; padding:0; color:#141414; color-scheme:light only;">
  <table
    class="signature-wrapper"
    role="presentation"
    cellpadding="0"
    cellspacing="0"
    border="0"
    width="500"
    height="200"
    style="
      width:500px !important;
      min-width:500px;
      max-width:500px;
      height:200px !important;
      table-layout:fixed;
      background-image:url('img/hyperiux/bg-pattern-new.png');
      background-repeat:no-repeat;
      background-size: contain;
      background-position:top left;
      background-color:#ffffff !important;
      color:#141414;
      color-scheme:light only;
      font-family:system-ui, Arial, sans-serif;
    "
    bgcolor="#ffffff"
  >
    <tr>
      <!-- PHOTO -->
      <td
        width="130"
        height="155"
        valign="middle"
        align="center"
        style="width:130px; height:155px; vertical-align:middle; padding-left:14px;"
      >
        <img
          src="img/hyperiux/bhaskar-profile.png"
          alt="Bhaskar Varshney"
          width="92"
          height="92"
          style="display:block; border-radius:50%; border:1px solid #ff6a1a; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;"
        />
      </td>

      <!-- CONTENT -->
      <td
        width="346"
        height="155"
        valign="middle"
        style="width:346px; height:155px; vertical-align:middle; padding-left:22px; padding-right:20px;"
      >
        <!-- Name + Designation -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; table-layout:fixed;">
          <tr>
            <td>
              <span
                class="signature-name"
                style="
                  display:block;
                  margin:0;
                  font-size:22px;
                  line-height:26px;
                  font-weight:500;
                  color:#141414 !important;
                  -webkit-text-fill-color:#141414 !important;
                  letter-spacing:0px;
                "
              >
                Bhaskar Varshney
              </span>

              <span
                class="signature-title"
                style="
                  display:block;
                  margin:3px 0 0 0;
                  font-size:10px;
                  line-height:13px;
                  font-weight:500;
                  color:#3a3a3a !important;
                  -webkit-text-fill-color:#3a3a3a !important;
                "
              >
                Founder &amp; CEO
              </span>
            </td>
          </tr>
        </table>

        <!-- Divider -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; table-layout:fixed;">
          <tr>
            <td style="padding-top:10px; padding-bottom:14px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="296" style="width:340px; border-collapse:collapse;">
                <tr>
                  <td width="42" height="5" valign="middle" style="width:50px; height:3px; font-size:0; line-height:1px; background-color:#ff6a1a; border-radius:3px;">&nbsp;</td>
                  <td width="254" height="5" valign="middle" style="width:290px; height:3px; font-size:0; line-height:1px;">
                    <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="254" height="1" style="width:290px; border-collapse:collapse;">
                      <tr>
                        <td width="254" height="1" style="width:290px; font-size:0; line-height:1px; background-color:#ff6a1a; background-image:linear-gradient(to right, #ff6a1a 0%, rgba(255,106,26,0) 100%);">&nbsp;</td>
                      </tr>
                    </table>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>

        <!-- Contact Details -->
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; table-layout:fixed;">
          <tr>
            <td width="22" height="22" valign="middle" style="width:22px; vertical-align:middle;">
              <img src="img/hyperiux/phone-icon.png" alt="Phone" width="12" height="12" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
            </td>
            <td valign="top" style="vertical-align:top; margin-top:-10px">
              <a
                class="signature-contact"
                href="tel:+918178026136"
                style="
                  display:inline-block;
                  font-size:9px;
                  line-height:12px;
                  color:#1a1a1a !important;
                  -webkit-text-fill-color:#1a1a1a !important;
                  text-decoration:none;
                  font-weight:400;
                "
              >
                +91 8178 026 136
              </a>
            </td>
          </tr>

          <tr>
            <td width="22" height="22" valign="top" style="width:22px; vertical-align:middle;">
              <img src="img/hyperiux/web-icon.png" alt="Website" width="12" height="12" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
            </td>
            <td valign="top" style="vertical-align:top;">
              <a
                class="signature-contact"
                href="https://www.hyperiux.com/"
                target="_blank"
                style="
                  display:inline-block;
                  font-size:9px;
                  line-height:12px;
                  color:#1a1a1a !important;
                  -webkit-text-fill-color:#1a1a1a !important;
                  text-decoration:none;
                  font-weight:400;
                "
              >
                www.hyperiux.com
              </a>
            </td>
          </tr>

          <tr>
            <td width="22" height="34" valign="top" style="width:22px; vertical-align:top; padding-top:3px;">
              <img src="img/hyperiux/location-icon.png" alt="Location" width="10" height="13" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
            </td>
            <td valign="top" style="vertical-align:top; padding-top:3px;">
              <span
                class="signature-contact"
                style="
                  display:inline-block;
                  font-size:9px;
                  line-height:12px;
                  color:#1a1a1a !important;
                  -webkit-text-fill-color:#1a1a1a !important;
                  font-weight:400;
                "
              >
                312, Grandslam I-Thum, Tower A 40, Sector-62,<br />
                Noida, Uttar Pradesh&nbsp; 201309
              </span>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- BOTTOM BAR -->
    <tr>
      <td
        colspan="2"
        width="500"
        height="45"
        valign="middle"
        style="
          width:500px;
          height:45px;
          vertical-align:middle;
          background-image:url('img/hyperiux/bottom-bar-bg.png');
          background-repeat:no-repeat;
          background-size:100% 100%;
          background-position:center;
          
        "
        bgcolor="#000000"
      >
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="width:100%; table-layout:fixed;">
          <tr>
            <td width="250" valign="middle" align="left" style="width:230px; vertical-align:middle; padding-left:35px;">
              <a href="https://www.hyperiux.com/" target="_blank">
                <img src="img/hyperiux/logo-white.png" alt="HYPERIUX" width="80" height="10" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
              </a>
            </td>
            <td width="250" valign="middle" align="right" style="width:230px; vertical-align:middle; padding-right:26px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                <tr>
                  <td>
                    <a href="https://x.com/" target="_blank">
                      <img src="img/hyperiux/x-icon.png" alt="X" width="10" height="10" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
                    </a>
                  </td>
                  <td style="padding-left:14px;">
                    <a href="https://www.instagram.com/" target="_blank">
                      <img src="img/hyperiux/insta-icon.png" alt="Instagram" width="10" height="10" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
                    </a>
                  </td>
                  <td style="padding-left:14px;">
                    <a href="https://www.facebook.com/" target="_blank">
                      <img src="img/hyperiux/fb-icon.png" alt="Facebook" width="5" height="10" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
                    </a>
                  </td>
                  <td style="padding-left:14px;">
                    <a href="https://www.linkedin.com/" target="_blank">
                      <img src="img/hyperiux/linkedin-icon.png" alt="LinkedIn" width="10" height="10" style="display:block; opacity:1 !important; filter:none !important; -webkit-filter:none !important; mix-blend-mode:normal !important;" />
                    </a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
