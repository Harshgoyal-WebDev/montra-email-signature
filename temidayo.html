<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light only" />
    <meta name="supported-color-schemes" content="light only" />
    <meta
      name="format-detection"
      content="telephone=no, date=no, address=no, email=no, url=no"
    />
    <title>Email Signature</title>
    <style>
      :root {
        color-scheme: light only;
        supported-color-schemes: light only;
      }

      body,
      table,
      td,
      p,
      a {
        color-scheme: light only;
      }

      [data-ogsc] .signature-wrapper,
      [data-ogsb] .signature-wrapper {
        background-color: #0b3fd6 !important;
      }

      [data-ogsc] .signature-name,
      [data-ogsb] .signature-name,
      [data-ogsc] .signature-title,
      [data-ogsb] .signature-title,
      [data-ogsc] .signature-contact,
      [data-ogsb] .signature-contact {
        color: #ffffff !important;
        -webkit-text-fill-color: #ffffff !important;
      }

      /* Neutralize Apple Mail's auto data-detector styling (phone/address links) */
      .x-apple-data-detectors,
      .x-apple-data-detectors *,
      a[x-apple-data-detectors] {
        color: inherit !important;
        text-decoration: none !important;
        font-size: inherit !important;
        font-family: inherit !important;
        font-weight: inherit !important;
        line-height: inherit !important;
      }
    </style>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      color: #ffffff !important;
      color-scheme: light only;
    "
  >
    <table
      class="signature-wrapper"
      role="presentation"
      cellpadding="0"
      cellspacing="0"
      border="0"
      width="600"
      height="200"
      style="
        width: 600px !important;
        min-width: 600px;
        max-width: 600px;
        height: 200px !important;
        table-layout: fixed;
        background-image: url(&quot;https://montra-email-signature.vercel.app/img/montra-email-signature-bg.png&quot;);
        background-repeat: no-repeat;
        background-size: 100% 100%;
        background-position: center;
        background-color: #0b3fd6 !important;
        color: #ffffff !important;
        color-scheme: light only;
        font-family: system-ui, Arial, sans-serif;
      "
      bgcolor="#0b3fd6"
    >
      <tr>
        <!-- LEFT CONTENT -->
        <td
          valign="top"
          width="325"
          style="
            width: 325px;
            vertical-align: top;
            padding-left: 35px;
            padding-top: 20px;
          "
        >
          <!-- Name + Designation -->
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="100%"
            style="width: 100%; table-layout: fixed"
          >
            <tr>
              <td>
                <span
                  class="signature-name"
                  style="
                    display: block;
                    margin: 0;
                    font-size: 22px;
                    line-height: 28px;
                    font-weight: 400;
                    color: #ffffff !important;
                    -webkit-text-fill-color: #ffffff !important;
                    letter-spacing: 0px;
                  "
                >
                  Temidayo Peter Toloruntomi
                </span>

                <span
                  class="signature-title"
                  style="
                    display: block;
                    margin: 4px 0 0 0;
                    font-size: 12px;
                    line-height: 16px;
                    font-weight: 400;
                    color: #ffffff !important;
                    -webkit-text-fill-color: #ffffff !important;
                  "
                >
                  Head - Agency Banking & Payments
                </span>
              </td>
            </tr>
          </table>

          <!-- Divider -->
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="100%"
            style="width: 100%; table-layout: fixed"
          >
            <tr>
              <td style="padding-top: 10px; padding-bottom: 12px">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                  width="160"
                  height="1"
                  style="width: 160px; border-collapse: collapse"
                >
                  <tr>
                    <td
                      width="160"
                      height="1"
                      style="
                        width: 160px;
                        font-size: 0;
                        line-height: 1px;
                        background-color: rgba(255, 255, 255, 0.4);
                      "
                    >
                      &nbsp;
                    </td>
                  </tr>
                </table>
              </td>
            </tr>
          </table>

          <!-- Contact Details -->
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="320"
            style="width: 320px; table-layout: fixed"
          >
            <tr>
              <td
                width="24"
                height="26"
                valign="middle"
                style="width: 24px; vertical-align: middle; padding-top: 4px"
              >
                <img
                  src="https://montra-email-signature.vercel.app/img/contact-img-new.png"
                  alt="Phone"
                  width="16"
                  height="16"
                  style="
                    display: block;
                    opacity: 1 !important;
                    filter: none !important;
                    -webkit-filter: none !important;
                    mix-blend-mode: normal !important;
                  "
                />
              </td>
              <td
                width="296"
                height="26"
                valign="middle"
                style="width: 296px; vertical-align: middle"
              >
                <a
                  class="signature-contact"
                  href="tel:+2348067902754"
                  style="
                    display: inline-block;
                    font-size: 12px;
                    line-height: 17px;
                    color: #ffffff !important;
                    -webkit-text-fill-color: #ffffff !important;
                    text-decoration: none;
                    font-weight: 400;
                  "
                >
                  +234 806 790 2754
                </a>
              </td>
            </tr>

            <tr>
              <td
                width="24"
                height="26"
                valign="middle"
                style="width: 24px; vertical-align: middle; padding-top: 2px"
              >
                <img
                  src="https://montra-email-signature.vercel.app/img/web-img-new.png"
                  alt="Website"
                  width="15"
                  height="15"
                  style="
                    display: block;
                    opacity: 1 !important;
                    filter: none !important;
                    -webkit-filter: none !important;
                    mix-blend-mode: normal !important;
                  "
                />
              </td>
              <td
                width="296"
                height="26"
                valign="middle"
                style="width: 296px; vertical-align: middle"
              >
                <a
                  class="signature-contact"
                  href="https://www.montra.app/"
                  target="_blank"
                  style="
                    display: inline-block;
                    font-size: 12px;
                    line-height: 17px;
                    color: #ffffff !important;
                    -webkit-text-fill-color: #ffffff !important;
                    text-decoration: none;
                    font-weight: 300;
                  "
                >
                  www.montra.app
                </a>
              </td>
            </tr>

            <tr>
              <td
                width="24"
                height="36"
                valign="top"
                style="width: 24px; vertical-align: top; padding-top: 10px"
              >
                <img
                  src="https://montra-email-signature.vercel.app/img/location-img-new.png"
                  alt="Location"
                  width="14"
                  height="15"
                  style="
                    display: block;
                    opacity: 1 !important;
                    filter: none !important;
                    -webkit-filter: none !important;
                    mix-blend-mode: normal !important;
                  "
                />
              </td>
              <td
                width="296"
                height="36"
                valign="top"
                style="width: 296px; vertical-align: top; padding-top: 4px"
              >
                <a
                  class="signature-contact"
                  href="https://www.google.com/maps/search/?api=1&amp;query=20%2C+Layi+Yusuf+Crescent%2C+Off+Admiralty%2C+Lekki+Phase+1%2C+Lagos%2C+Nigeria"
                  target="_blank"
                  style="
                    display: inline-block;
                    margin: 0;
                    white-space: nowrap;
                    font-size: 12px;
                    line-height: 17px;
                    color: #ffffff !important;
                    -webkit-text-fill-color: #ffffff !important;
                    text-decoration: none;
                    font-weight: 300;
                  "
                >
                  20, Layi Yusuf Crescent, Off Admiralty,<br />
                  Lekki Phase 1, Lagos, Nigeria
                </a>
              </td>
            </tr>
          </table>
        </td>

        <!-- RIGHT SIDE -->
        <td valign="top" width="240" style="width: 240px; vertical-align: top">
          <table
            role="presentation"
            cellpadding="0"
            cellspacing="0"
            border="0"
            width="100%"
            style="width: 100%; table-layout: fixed"
          >
            <!-- Social Icons -->
            <tr>
              <td align="right" style="padding-top: 22px; padding-right: 30px">
                <table
                  role="presentation"
                  cellpadding="0"
                  cellspacing="0"
                  border="0"
                >
                  <tr>
                    <td>
                      <a href="https://www.facebook.com/#" target="_blank">
                        <img
                          src="https://montra-email-signature.vercel.app/img/fb-img-new.png"
                          alt="Facebook"
                          width="20"
                          height="20"
                          style="
                            display: block;
                            opacity: 1 !important;
                            filter: none !important;
                            -webkit-filter: none !important;
                            mix-blend-mode: normal !important;
                          "
                        />
                      </a>
                    </td>
                    <td style="padding-left: 7px">
                      <a href="https://x.com/MontraInc" target="_blank">
                        <img
                          src="https://montra-email-signature.vercel.app/img/x-img-new.png"
                          alt="X"
                          width="20"
                          height="20"
                          style="
                            display: block;
                            opacity: 1 !important;
                            filter: none !important;
                            -webkit-filter: none !important;
                            mix-blend-mode: normal !important;
                          "
                        />
                      </a>
                    </td>
                    <td style="padding-left: 7px">
                      <a
                        href="https://www.instagram.com/montrainc/"
                        target="_blank"
                      >
                        <img
                          src="https://montra-email-signature.vercel.app/img/insta-img-new.png"
                          alt="Instagram"
                          width="20"
                          height="20"
                          style="
                            display: block;
                            opacity: 1 !important;
                            filter: none !important;
                            -webkit-filter: none !important;
                            mix-blend-mode: normal !important;
                          "
                        />
                      </a>
                    </td>
                    <td style="padding-left: 7px">
                      <a
                        href="https://www.linkedin.com/company/montraglobalinc"
                        target="_blank"
                      >
                        <img
                          src="https://montra-email-signature.vercel.app/img/linkedin-img-new.png"
                          alt="LinkedIn"
                          width="20"
                          height="20"
                          style="
                            display: block;
                            opacity: 1 !important;
                            filter: none !important;
                            -webkit-filter: none !important;
                            mix-blend-mode: normal !important;
                          "
                        />
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Spacer -->
            <tr>
              <td height="100"></td>
            </tr>

            <!-- Logo -->
            <tr>
              <td
                align="right"
                style="padding-right: 30px; padding-bottom: 18px"
              >
                <a href="https://www.montra.app/" target="_blank">
                  <img
                    src="https://montra-email-signature.vercel.app/img/logo.png"
                    alt="Montra"
                    width="115"
                    style="
                      display: block;
                      opacity: 1 !important;
                      filter: none !important;
                      -webkit-filter: none !important;
                      mix-blend-mode: normal !important;
                    "
                  />
                </a>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
